<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>12 Главк</title>
    <style>
        :root {
            --bg-color: #050b14;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --accent-color: #38bdf8;
            --card-shadow: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --glass-bg: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-color: #1e293b;
            --accent-color: #0284c7;
            --card-shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 80%);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 var(--card-shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1, h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-color);
        }

        h2 {
            font-size: 16px;
            margin-bottom: 14px;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Панель вкладок (Табы) */
        .tab-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        
        .tab-bar::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
            opacity: 0.7;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border-color: transparent;
            opacity: 1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .input-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
        }

        .btn-link {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-box {
            margin-top: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
            line-height: 1.6;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="glass-card header">
        <div>
            <h1>12 Главк</h1>
            <p style="font-size:11px; opacity:0.6;">Мобильный комплекс</p>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">Смена темы</button>
    </div>

    <div id="main-content">

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('tab-dd', this)">Калькулятор ДД</button>
            <button class="tab-btn" onclick="switchTab('tab-fizo', this)">ФИЗО</button>
            <button class="tab-btn" onclick="switchTab('tab-vysluga', this)">Выслуга</button>
            <button class="tab-btn" onclick="switchTab('tab-notes', this)">Заметки</button>
            <button class="tab-btn" onclick="switchTab('tab-feedback', this)">Обратная связь</button>
        </div>

        <div id="tab-dd" class="tab-content glass-card">
            <h2>Калькулятор ДД (Минобороны)</h2>
            
            <div class="input-group">
                <label>Воинское звание</label>
                <select id="dd-zv" class="input-control">
                    <option value="6420" selected>Рядовой / Матрос</option>
                    <option value="6960">Ефрейтор / Старший матрос</option>
                    <option value="7490">Младший сержант / Старшина 2 статьи</option>
                    <option value="8030">Сержант / Старшина 1 статьи</option>
                    <option value="8560">Старший сержант / Главный старшина</option>
                    <option value="9100">Старшина / Главный корабельный старшина</option>
                    <option value="12450">Прапорщик / Мичман</option>
                    <option value="13530">Старший прапорщик / Старший мичман</option>
                    <option value="14070">Младший лейтенант</option>
                    <option value="14610">Лейтенант</option>
                    <option value="15690">Старший лейтенант</option>
                    <option value="16770">Капитан / Капитан-лейтенант</option>
                    <option value="17850">Майор / Капитан 3 ранга</option>
                    <option value="18930">Подполковник / Капитан 2 ранга</option>
                    <option value="20010">Полковник / Капитан 1 ранга</option>
                </select>
            </div>

            <div class="input-group">
                <label>Тарифный разряд (Воинская должность)</label>
                <select id="dd-dolzh" class="input-control">
                    <option value="14090">1 тарифный разряд</option>
                    <option value="16250">2 тарифный разряд</option>
                    <option value="18420">4 тарифный разряд</option>
                    <option value="19500" selected>6 тарифный разряд</option>
                    <option value="21670">8 тарифный разряд</option>
                    <option value="23830">10 тарифный разряд</option>
                    <option value="26000">12 тарифный разряд</option>
                </select>
            </div>

            <div class="input-group">
                <label>Выслуга лет (полных лет)</label>
                <input type="number" id="dd-vysl-years" class="input-control" value="9" min="0">
            </div>

            <div class="input-group">
                <label>Форма допуска (Секретность)</label>
                <select id="dd-secret" class="input-control">
                    <option value="0">Нет допуска</option>
                    <option value="10">3-я форма (10%)</option>
                    <option value="20" selected>2-я форма (20%)</option>
                    <option value="25">1-я форма (25%)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Северная надбавка (%)</label>
                <input type="range" id="dd-sever" min="0" max="100" value="0" step="10" oninput="this.nextElementSibling.innerText = this.value + '%'">
                <span style="font-size: 12px; margin-left: 5px;">0%</span>
            </div>

            <div class="input-group">
                <label>Районный коэффициент</label>
                <select id="dd-rayon" class="input-control">
                    <option value="1.0">1.0 (Стандартный)</option>
                    <option value="1.15">1.15 (Коэффициент 1.15)</option>
                    <option value="1.20">1.20 (Коэффициент 1.20)</option>
                    <option value="1.50">1.50 (Коэффициент 1.50)</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dd-moscow" checked>
                <label for="dd-moscow">Региональная надбавка (Москва/МО/СПб) (+50% должности)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dd-emo" checked>
                <label for="dd-emo">Ежемесячная премия за добросовестную службу (+25% ОДС)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dd-doblest" checked>
                <label for="dd-doblest">Медаль «За воинскую доблесть» II ст. (+20% должности)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dd-medal5" checked>
                <label for="dd-medal5">Ведомственные знаки отличия / Медаль за 5 лет (+10% должности)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dd-nous" checked>
                <label for="dd-nous">Особые условия службы (НОУС / Спецобъекты) (+30% должности)</label>
            </div>

            <button class="btn" onclick="calcDD()">Рассчитать довольствие</button>
            <div id="dd-result" class="result-box">Нажмите кнопку для расчета.</div>
        </div>

        <div id="tab-fizo" class="tab-content glass-card hidden">
            <h2>Калькулятор ФИЗО</h2>
            <div class="input-group">
                <label>Баллы за 1-е упражнение</label>
                <input type="number" id="fizo1" class="input-control" value="0">
            </div>
            <div class="input-group">
                <label>Баллы за 2-е упражнение</label>
                <input type="number" id="fizo2" class="input-control" value="0">
            </div>
            <div class="input-group">
                <label>Баллы за 3-е упражнение</label>
                <input type="number" id="fizo3" class="input-control" value="0">
            </div>
            <button class="btn" onclick="calcFizo()">Итог по ФИЗО</button>
            <div id="fizo-result" class="result-box"></div>
        </div>

        <div id="tab-vysluga" class="tab-content glass-card hidden">
            <h2>Расчет выслуги лет</h2>
            <div class="input-group">
                <label>Дата начала службы</label>
                <input type="date" id="vysl-start" class="input-control">
            </div>
            <button class="btn" onclick="calcVysluga()">Рассчитать выслугу</button>
            <div id="vysl-result" class="result-box"></div>
        </div>

        <div id="tab-notes" class="tab-content glass-card hidden">
            <h2>Календарь и пометки</h2>
            <div class="input-group">
                <label>Выберите дату</label>
                <input type="date" id="cal-date" class="input-control">
            </div>
            <div class="input-group">
                <label>Заметка на этот день</label>
                <input type="text" id="cal-text" class="input-control" placeholder="Текст заметки">
            </div>
            <button class="btn" onclick="saveNote()">Сохранить пометку</button>
            <button class="btn" style="background:transparent; border:1px solid var(--glass-border); margin-top:8px;" onclick="showNote()">Посмотреть заметку</button>
            <div id="cal-result" class="result-box"></div>
        </div>

        <div id="tab-feedback" class="tab-content glass-card hidden">
            <h2>Обратная связь</h2>
            <div class="input-group">
                <label>ФИО кандидата / Текст обращения</label>
                <textarea id="feedback-text" class="input-control" rows="3" placeholder="Введите информацию..."></textarea>
            </div>
            <button class="btn" onclick="sendMail('Жалоба')">Отправить жалобу</button>
            <button class="btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);" onclick="sendMail('Анкета кандидата')">Отправить анкету</button>
            
            <h2 style="margin-top: 24px;">Официальные ресурсы</h2>
            <a href="https://vk.ru/12mil" class="btn-link" target="_blank">Перейти в VK</a>
            <a href="https://max.ru/sila" class="btn-link" target="_blank">Перейти в MAX</a>
            <a href="https://mil.ru/service/contract12" class="btn-link" target="_blank">Сайт (Служба по контракту)</a>
        </div>

    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        // Логика переключения табов
        function switchTab(tabId, element) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.add('hidden'));
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.remove('hidden');
            element.classList.add('active');
        }

        function calcDD() {
            const zvOklad = parseFloat(document.getElementById('dd-zv').value) || 0;
            const dolzhOklad = parseFloat(document.getElementById('dd-dolzh').value) || 0;
            
            const ods = zvOklad + dolzhOklad;
            
            const years = parseInt(document.getElementById('dd-vysl-years').value) || 0;
            let vyslPct = 0;
            if (years >= 2 && years < 5) vyslPct = 10;
            else if (years >= 5 && years < 10) vyslPct = 15;
            else if (years >= 10 && years < 15) vyslPct = 20;
            else if (years >= 15 && years < 20) vyslPct = 25;
            else if (years >= 20 && years < 25) vyslPct = 30;
            else if (years >= 25) vyslPct = 40;
            
            const vyslBonus = ods * (vyslPct / 100);
            const emoBonus = document.getElementById('dd-emo').checked ? (ods * 0.25) : 0;
            
            const secretPct = parseFloat(document.getElementById('dd-secret').value) || 0;
            const secretBonus = dolzhOklad * (secretPct / 100);
            
            const moscowBonus = document.getElementById('dd-moscow').checked ? (dolzhOklad * 0.50) : 0;
            
            let achievements = 0;
            if (document.getElementById('dd-doblest').checked) achievements += (dolzhOklad * 0.20);
            if (document.getElementById('dd-medal5').checked) achievements += (dolzhOklad * 0.10);
            if (document.getElementById('dd-nous').checked) achievements += (dolzhOklad * 0.30);
            
            let subTotal = ods + vyslBonus + emoBonus + secretBonus + moscowBonus + achievements;
            
            const rayCoef = parseFloat(document.getElementById('dd-rayon').value) || 1.0;
            const severPct = parseFloat(document.getElementById('dd-sever').value) || 0;
            
            let totalGross = (subTotal * rayCoef) + (ods * (severPct / 100));
            let totalNet = totalGross * 0.87; 
            
            document.getElementById('dd-result').innerHTML = `
                <span style="color:var(--text-color);">Начислено (грязными): <strong>${totalGross.toFixed(0)} руб.</strong></span><br>
                <span style="color:#4ade80; font-size:16px;">На руки (с учетом НДФЛ): <strong>${totalNet.toFixed(0)} руб.</strong></span><br>
                <div style="font-size:11px; opacity:0.6; margin-top:8px; border-top:1px solid var(--glass-border); padding-top:4px;">
                    ОДС: ${ods} руб. | Выслуга (${vyslPct}%): ${vyslBonus.toFixed(0)} руб.<br>
                    Москва: ${moscowBonus.toFixed(0)} руб. | Секретность: ${secretBonus.toFixed(0)} руб.
                </div>
            `;
        }

        function calcFizo() {
            const f1 = parseInt(document.getElementById('fizo1').value) || 0;
            const f2 = parseInt(document.getElementById('fizo2').value) || 0;
            const f3 = parseInt(document.getElementById('fizo3').value) || 0;
            const total = f1 + f2 + f3;
            
            let grade = "Не сдано";
            if(total >= 180) grade = "Высший уровень";
            else if(total >= 160) grade = "1-й уровень";
            else if(total >= 120) grade = "2-й уровень";

            document.getElementById('fizo-result').innerText = `Всего баллов: ${total} (${grade})`;
        }

        function saveNote() {
            const date = document.getElementById('cal-date').value;
            const text = document.getElementById('cal-text').value;
            if(date && text) {
                localStorage.setItem('note_' + date, text);
                document.getElementById('cal-result').innerText = "Пометка сохранена!";
            }
        }
        function showNote() {
            const date = document.getElementById('cal-date').value;
            if(date) {
                const note = localStorage.getItem('note_' + date) || "Нет пометок на эту дату";
                document.getElementById('cal-result').innerText = note;
            }
        }

        function calcVysluga() {
            const startStr = document.getElementById('vysl-start').value;
            if(!startStr) return;
            const start = new Date(startStr);
            const now = new Date();
            const diffTime = Math.abs(now - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const years = Math.floor(diffDays / 365);
            const months = Math.floor((diffDays % 365) / 30);
            
            document.getElementById('vysl-result').innerText = `Выслуга календарная: ${years} л., ${months} мес.`;
        }

        function sendMail(subject) {
            const text = document.getElementById('feedback-text').value;
            const email = "rburov97@yandex.ru";
            if(!text.trim()) return;
            window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
        }
    </script>
</body>
</html>
