name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python and Pillow
        run: |
          pip install Pillow

      - name: Auto-Generate Android Project Structure
        run: |
          echo "=== Создание структуры и генерация эмблемы ==="
          mkdir -p app/src/main/java/com/glavk/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap
          
          # Скрипт генерации новой иконки: Величественный Золотой Двуглавый Орел
          cat << 'EOF' > generate_icon.py
          from PIL import Image, ImageDraw

          # Роскошный глубокий фон (темно-синий тактический бархат)
          img = Image.new('RGBA', (512, 512), '#020617')
          draw = ImageDraw.Draw(img)

          gold_light = '#fbbf24' # Яркое золото для бликов
          gold_base  = '#d4af37' # Классическое геральдическое золото
          gold_dark  = '#b45309' # Темное золото для контуров и объема

          # Внешний премиальный золотой кант
          draw.ellipse([15, 15, 497, 497], outline=gold_dark, width=6)
          draw.ellipse([22, 22, 490, 490], outline=gold_base, width=3)
          draw.ellipse([35, 35, 477, 477], outline=gold_light, width=1)

          # === ОТРИСОВКА ЗОЛОТОГО ДВУГЛАВОГО ОРЛА ===
          
          # 1. Хвост орла (нижняя часть)
          draw.polygon([(230, 390), (256, 460), (282, 390)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(210, 370), (225, 440), (245, 385)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(302, 370), (287, 440), (267, 385)], fill=gold_base, outline=gold_dark, width=2)

          # 2. Мощные крылья (левое и правое)
          # Левое крыло (перья вверх и вбок)
          draw.polygon([(220, 200), (60, 110), (120, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 230), (40, 180), (100, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(220, 260), (50, 260), (120, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 290), (80, 330), (150, 390)], fill=gold_dark, outline=gold_base, width=1)

          # Правое крыло (зеркальное отражение)
          draw.polygon([(292, 200), (452, 110), (392, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 230), (472, 180), (412, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(292, 260), (462, 260), (392, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 290), (432, 330), (362, 390)], fill=gold_dark, outline=gold_base, width=1)

          # 3. Лапы с символами власти
          # Левая лапа с державой
          draw.line([(180, 340), (210, 370)], fill=gold_base, width=8)
          draw.ellipse([165, 330, 195, 360], fill=gold_light, outline=gold_dark, width=2)
          # Правая лапа со скипетром
          draw.line([(332, 340), (302, 370)], fill=gold_base, width=8)
          draw.line([(340, 310), (320, 370)], fill=gold_light, width=6)

          # 4. Две шеи и головы
          # Левая голова
          draw.polygon([(230, 200), (200, 130), (245, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([195, 110, 230, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(200, 120), (175, 125), (200, 135)], fill=gold_light) # Клюв левый
          # Правая голова
          draw.polygon([(282, 200), (312, 130), (267, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([282, 110, 317, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(312, 120), (337, 125), (312, 135)], fill=gold_light) # Клюв правый

          # 5. Малые короны на головах
          draw.polygon([(200, 115), (207, 95), (215, 115)], fill=gold_light)
          draw.polygon([(297, 115), (305, 95), (312, 115)], fill=gold_light)

          # 6. Большая Императорская корона (по центру сверху)
          draw.polygon([(235, 90), (256, 45), (277, 90), (256, 75)], fill=gold_light, outline=gold_dark, width=2)
          draw.ellipse([251, 40, 261, 50], fill=gold_light) # Навершие короны

          # 7. Грудь и Центральный парадный щит
          draw.polygon([(215, 210), (297, 210), (297, 320), (256, 365), (215, 320)], fill='#1e293b', outline=gold_light, width=4)
          
          # Тиснение внутри щита (внутренний контур)
          draw.polygon([(225, 220), (287, 220), (287, 310), (256, 350), (225, 310)], outline=gold_dark, width=2)

          img.save('app/src/main/res/mipmap/ic_launcher.png')
          print("=== Иконка с золотым двуглавым орлом сгенерирована ===")
          EOF
          
          python3 generate_icon.py

          # Копируем интерфейс
          cp index.html app/src/main/assets/index.html
          
          # Настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = "GlavkApp"
          include ':app'
          EOF
          
          # Главный билд-файл
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Билд-файл приложения
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.glavk.app'
              defaultConfig {
                  applicationId "com.glavk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "glavk123"
                      keyAlias "glavk"
                      keyPassword "glavk123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          # Манифест приложения с цифровым названием в лаунчере
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="12 Главк" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Нативный Java-код с глубоким перехватом URL-схем mailto:
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebView webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      private void handleMailto(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_SENDTO);
                              intent.setData(Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  
                  webView.loadUrl("file:///android_asset/index.html");
                  layout.addView(webView);
                  setContentView(layout);
              }
              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  public void showSystemToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_LONG).show();
                  }
                  @JavascriptInterface
                  public void sendEmail(String subject, String text) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SENDTO);
                          intent.setData(Uri.parse("mailto:rburov97@yandex.ru"));
                          intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                          intent.putExtra(Intent.EXTRA_TEXT, text);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          mContext.startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(mContext, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
          EOF

      # Генерация официального криптографического Keystore для устранения ошибок подписи пакета
      - name: Generate Production Signing Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias glavk -keyalg RSA -keysize 2048 -validity 10000 -storepass glavk123 -keypass glavk123 -dname "CN=12Glavk, O=Glavk, C=RU"

      - name: Build Certified Release Application with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished Certified APK
        uses: actions/upload-artifact@v4
        with:
          name: GlavkApp-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
