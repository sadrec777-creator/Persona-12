name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Full Project
        run: |
          mkdir -p app/src/main/java/com/glavk/app app/src/main/assets
          
          # --- ПОЛНАЯ КОНФИГУРАЦИЯ ИНТЕРФЕЙСА ---
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  body { background: #0f172a; background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%); color: #fff; margin: 0; font-family: 'Segoe UI', sans-serif; }
                  .tab-content { display: none; padding: 20px; padding-bottom: 120px; }
                  .active-tab { display: block; }
                  .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
                  select, input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: rgba(0,0,0,0.3); border: 1px solid #334155; color: #fff; border-radius: 8px; }
                  .btn { background: #d4af37; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; text-transform: uppercase; }
                  nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #334155; }
                  .nav-btn { background: none; border: none; color: #94a3b8; font-size: 9px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
                  .nav-btn.active { color: #d4af37; }
              </style>
          </head>
          <body>
              <div id="tab-dd" class="tab-content active-tab">
                  <div class="card">
                      <h3>Денежное довольствие</h3>
                      <select id="rank">
                          <option value="6000">Рядовой</option><option value="7500">Ефрейтор</option><option value="8500">Мл. сержант</option><option value="10000">Сержант</option><option value="12000">Ст. сержант</option>
                          <option value="13000">Старшина</option><option value="15000">Прапорщик</option><option value="16000">Ст. прапорщик</option><option value="18000">Мл. лейтенант</option><option value="20000">Лейтенант</option>
                          <option value="22000">Ст. лейтенант</option><option value="25000">Капитан</option><option value="30000">Майор</option><option value="35000">Подполковник</option><option value="40000">Полковник</option>
                      </select>
                      <select id="tariff">
                          <option value="10000">1 разряд (10000)</option><option value="12000">2 разряд</option><option value="14000">3 разряд</option><option value="16000">4 разряд</option><option value="18000">5 разряд</option>
                          <option value="20000">6 разряд</option><option value="22000">7 разряд</option><option value="24000">8 разряд</option><option value="26000">9 разряд</option><option value="28000">10 разряд</option>
                          <option value="30000">11 разряд</option><option value="32000">12 разряд</option><option value="34000">13 разряд</option><option value="36000">14 разряд</option><option value="38000">15 разряд</option>
                          <option value="40000">16 разряд</option><option value="42000">17 разряд</option><option value="44000">18 разряд</option><option value="46000">19 разряд</option><option value="50000">20 разряд</option>
                      </select>
                      <select id="vysluga"><option value="0.0">Без выслуги</option><option value="0.1">2-5 лет</option><option value="0.2">5-10 лет</option><option value="0.3">10-15 лет</option><option value="0.4">15-20 лет</option><option value="0.7">20+ лет</option></select>
                      <select id="secret"><option value="0.0">Без секретности</option><option value="0.2">20%</option><option value="0.5">50%</option><option value="0.65">65%</option></select>
                      <div style="font-size:12px; margin:10px 0;">
                          <label><input type="checkbox" id="moscow"> Московская надбавка (50%)</label><br>
                          <label><input type="checkbox" id="spec" checked> Главковская (1.25)</label>
                      </div>
                      <button class="btn" onclick="calc()">РАССЧИТАТЬ</button>
                      <div id="dd-res" style="text-align:center; font-size:26px; color:#d4af37; margin-top:15px; font-weight:bold;">0 ₽</div>
                  </div>
              </div>
              <div id="tab-fp" class="tab-content"><div class="card"><h3>ФП: Баллы</h3><input id="p" placeholder="Подтягивания"><input id="r" placeholder="Бег 3км (с)"><button class="btn" onclick="calcFP()">РАСЧЕТ</button><div id="fp-res" style="text-align:center; margin-top:10px; color:#d4af37;">0 баллов</div></div></div>
              <div id="tab-calendar" class="tab-content"><div class="card"><h3>Календарь/Заметки</h3><textarea id="notes" style="height:150px;"></textarea><button class="btn" onclick="save()">СОХРАНИТЬ</button></div></div>
              <div id="tab-anketa" class="tab-content"><div class="card"><h3>Анкета</h3><input placeholder="ФИО"><input placeholder="Должность"><input placeholder="Подразделение"><button class="btn">ОТПРАВИТЬ</button></div></div>
              <div id="tab-complaint" class="tab-content"><div class="card"><h3>Жалоба</h3><textarea style="height:150px;"></textarea><button class="btn">НАПРАВИТЬ</button></div></div>
              
              <nav>
                  <button class="nav-btn active" onclick="go('dd', this)">ДД</button>
                  <button class="nav-btn" onclick="go('fp', this)">ФП</button>
                  <button class="nav-btn" onclick="go('calendar', this)">Заметки</button>
                  <button class="nav-btn" onclick="go('anketa', this)">Анкета</button>
                  <button class="nav-btn" onclick="go('complaint', this)">Жалоба</button>
              </nav>
              <script>
                  function go(id, btn){ document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active-tab')); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('tab-'+id).classList.add('active-tab'); btn.classList.add('active'); }
                  function calc(){
                      const base = parseFloat(document.getElementById('rank').value) + parseFloat(document.getElementById('tariff').value);
                      let total = base * (1 + parseFloat(document.getElementById('vysluga').value) + parseFloat(document.getElementById('secret').value));
                      if(document.getElementById('moscow').checked) total *= 1.5;
                      if(document.getElementById('spec').checked) total *= 1.25;
                      document.getElementById('dd-res').innerText = Math.round(total).toLocaleString() + " ₽";
                  }
                  function calcFP(){ document.getElementById('fp-res').innerText = (parseInt(document.getElementById('p').value)*5 + " баллов"); }
                  function save(){ localStorage.setItem('n', document.getElementById('notes').value); alert('Сохранено'); }
                  document.getElementById('notes').value = localStorage.getItem('n') || '';
              </script>
          </body>
          </html>
          EOF

          # --- БАЗОВЫЕ ФАЙЛЫ ---
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.glavk.app">
              <application android:label="12 Главк" android:allowBackup="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView;
          public class MainActivity extends Activity { @Override protected void onCreate(Bundle b){ super.onCreate(b); WebView wv = new WebView(this); wv.getSettings().setJavaScriptEnabled(true); wv.getSettings().setDomStorageEnabled(true); wv.loadUrl("file:///android_asset/index.html"); setContentView(wv); } }
          EOF
          echo "rootProject.name = 'GlavkApp'" > settings.gradle; echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' } android { compileSdk 34; defaultConfig { applicationId 'com.glavk.app'; minSdk 21; targetSdk 34 } }" > app/build.gradle
          gradle wrapper; chmod +x gradlew; ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlavkApp
          path: app/build/outputs/apk/debug/app-debug.apk
