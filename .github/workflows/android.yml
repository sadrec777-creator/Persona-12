name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python and Pillow
        run: |
          pip install Pillow

      - name: Auto-Generate Android Project Structure
        run: |
          echo "=== Создание структуры и генерация эмблемы ==="
          mkdir -p app/src/main/java/com/glavk/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap
          
          # Скрипт генерации новой иконки: Величественный Золотой Двуглавый Орел
          cat << 'EOF' > generate_icon.py
          from PIL import Image, ImageDraw

          # Роскошный глубокий фон (темно-синий тактический бархат)
          img = Image.new('RGBA', (512, 512), '#020617')
          draw = ImageDraw.Draw(img)

          gold_light = '#fbbf24' # Яркое золото для бликов
          gold_base  = '#d4af37' # Классическое геральдическое золото
          gold_dark  = '#b45309' # Темное золото для контуров и объема

          # Внешний премиальный золотой кант
          draw.ellipse([15, 15, 497, 497], outline=gold_dark, width=6)
          draw.ellipse([22, 22, 490, 490], outline=gold_base, width=3)
          draw.ellipse([35, 35, 477, 477], outline=gold_light, width=1)

          # === ОТРИСОВКА ЗОЛОТОГО ДВУГЛАВОГО ОРЛА ===
          
          # 1. Хвост орла
          draw.polygon([(230, 390), (256, 460), (282, 390)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(210, 370), (225, 440), (245, 385)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(302, 370), (287, 440), (267, 385)], fill=gold_base, outline=gold_dark, width=2)

          # 2. Мощные крылья
          draw.polygon([(220, 200), (60, 110), (120, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 230), (40, 180), (100, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(220, 260), (50, 260), (120, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 290), (80, 330), (150, 390)], fill=gold_dark, outline=gold_base, width=1)

          # Правое крыло
          draw.polygon([(292, 200), (452, 110), (392, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 230), (472, 180), (412, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(292, 260), (462, 260), (392, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 290), (432, 330), (362, 390)], fill=gold_dark, outline=gold_base, width=1)

          # 3. Лапы с символами власти
          draw.line([(180, 340), (210, 370)], fill=gold_base, width=8)
          draw.ellipse([165, 330, 195, 360], fill=gold_light, outline=gold_dark, width=2)
          draw.line([(332, 340), (302, 370)], fill=gold_base, width=8)
          draw.line([(340, 310), (320, 370)], fill=gold_light, width=6)

          # 4. Две шеи и головы
          draw.polygon([(230, 200), (200, 130), (245, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([195, 110, 230, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(200, 120), (175, 125), (200, 135)], fill=gold_light)
          
          draw.polygon([(282, 200), (312, 130), (267, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([282, 110, 317, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(312, 120), (337, 125), (312, 135)], fill=gold_light)

          # 5. Короны
          draw.polygon([(200, 115), (207, 95), (215, 115)], fill=gold_light)
          draw.polygon([(297, 115), (305, 95), (312, 115)], fill=gold_light)
          draw.polygon([(235, 90), (256, 45), (277, 90), (256, 75)], fill=gold_light, outline=gold_dark, width=2)
          draw.ellipse([251, 40, 261, 50], fill=gold_light)

          # 6. Центральный парадный щит
          draw.polygon([(215, 210), (297, 210), (297, 320), (256, 365), (215, 320)], fill='#0f172a', outline=gold_light, width=4)
          draw.polygon([(225, 220), (287, 220), (287, 310), (256, 350), (225, 310)], outline=gold_dark, width=2)

          img.save('app/src/main/res/mipmap/ic_launcher.png')
          print("=== Премиальный золотой логотип сгенерирован ===")
          EOF
          
          python3 generate_icon.py

          # ГЕНЕРАЦИЯ ПОЛНОЦЕННОГО МНОГОФУНКЦИОНАЛЬНОГО ИНТЕРФЕЙСА С ВКЛАДКАМИ
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>12 Главк — Мобильный Комплекс</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  body { background-color: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                  
                  /* Шапка */
                  .header { background: #111827; border-bottom: 1px solid #1f2937; padding: 14px; text-align: center; font-size: 16px; font-weight: bold; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; }
                  
                  /* Контентная область */
                  .content-area { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
                  .tab-content { display: none; max-width: 500px; margin: 0 auto; }
                  .tab-content.active { display: block; }
                  
                  /* Стили карточек и форм */
                  .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); margin-bottom: 16px; }
                  h3 { color: #d4af37; margin-bottom: 14px; font-size: 16px; text-transform: uppercase; border-left: 3px solid #d4af37; padding-left: 8px; }
                  p { font-size: 14px; color: #d1d5db; line-height: 1.5; margin-bottom: 10px; }
                  
                  .form-group { margin-bottom: 14px; }
                  label { display: block; margin-bottom: 6px; font-size: 13px; color: #9ca3af; font-weight: 500; }
                  select, input[type="number"], input[type="text"] { width: 100%; padding: 11px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; }
                  select:focus, input:focus { border-color: #d4af37; }
                  
                  .checkbox-card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; }
                  .checkbox-card input[type="checkbox"] { width: 18px; height: 18px; margin-right: 12px; accent-color: #d4af37; }
                  .checkbox-card span { font-size: 13px; color: #e5e7eb; }
                  
                  .result-box { margin-top: 20px; background: linear-gradient(135deg, #1e1b4b, #111827); border: 2px solid #d4af37; border-radius: 10px; padding: 14px; text-align: center; }
                  .result-title { font-size: 12px; color: #9ca3af; text-transform: uppercase; }
                  .result-value { font-size: 26px; font-weight: bold; color: #d4af37; margin: 6px 0; }
                  
                  .btn { display: block; width: 100%; padding: 12px; background: #d4af37; color: #0b0f19; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
                  .btn:active { background: #f59e0b; }
                  
                  /* Нижнее меню навигации */
                  .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #111827; border-top: 1px solid #1f2937; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
                  .nav-item { flex: 1; text-align: center; background: none; border: none; color: #9ca3af; font-size: 11px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 4px; }
                  .nav-item.active { color: #d4af37; }
                  .nav-icon { font-size: 18px; font-weight: bold; }
              </style>
          </head>
          <body>

              <div class="header" id="header-title">Главная</div>

              <div class="content-area">
                  
                  <div id="tab-main" class="tab-content active">
                      <div class="card">
                          <h3>12 Главное управление МО РФ</h3>
                          <p>Добро пожаловать в специализированный мобильный комплекс отбора кандидатов на военную службу по контракту.</p>
                          <p>Здесь вы можете рассчитать параметры будущего финансового обеспечения, проверить свои нормативы по физической подготовке и подать заявку в кадровый орган.</p>
                      </div>
                      <div class="card">
                          <h3>Преимущества службы</h3>
                          <p>• Повышенное денежное довольствие со старта службы.</p>
                          <p>• Служебное жилье или полная компенсация найма.</p>
                          <p>• Военная ипотека через 3 года службы.</p>
                      </div>
                  </div>

                  <div id="tab-dd" class="tab-content">
                      <div class="card">
                          <h3>Расчёт денежного довольствия</h3>
                          
                          <div class="form-group">
                              <label>Воинское звание</label>
                              <select id="rank" onchange="calculateDD()">
                                  <option value="6500" selected>Рядовой / Матрос</option>
                                  <option value="7000">Ефрейтор / Старший матрос</option>
                                  <option value="7500">Младший сержант</option>
                                  <option value="8000">Сержант</option>
                                  <option value="8500">Старший сержант</option>
                                  <option value="10000">Прапорщик</option>
                                  <option value="11500">Лейтенант</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Тарифный разряд должности</label>
                              <select id="tariff" onchange="calculateDD()">
                                  <option value="12000" selected>1 тарифный разряд (Стрелок)</option>
                                  <option value="13000">2 тарифный разряд (Пулеметчик)</option>
                                  <option value="14000">3 тарифный разряд (Старший стрелок)</option>
                                  <option value="15000">4 тарифный разряд (Водитель)</option>
                                  <option value="16000">5 тарифный разряд (Командир отделения)</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Выслуга лет</label>
                              <select id="experience" onchange="calculateDD()">
                                  <option value="0" selected>менее 2 лет (0%)</option>
                                  <option value="0.10">от 2 до 5 лет (10%)</option>
                                  <option value="0.15">от 5 до 10 лет (15%)</option>
                                  <option value="0.20">от 10 до 15 лет (20%)</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Допуск к гостайне</label>
                              <select id="secrecy" onchange="calculateDD()">
                                  <option value="0" selected>Нет допуска (0%)</option>
                                  <option value="0.10">3 форма (10%)</option>
                                  <option value="0.20">2 форма (20%)</option>
                                  <option value="0.25">1 форма (25%)</option>
                              </select>
                          </div>

                          <label>Дополнительные надбавки</label>
                          
                          <div class="checkbox-card" onclick="toggleDDCheckbox('cl')">
                              <input type="checkbox" id="cl" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Классная квалификация (+10%)</span>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('fp_bonus')">
                              <input type="checkbox" id="fp_bonus" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Высший уровень ФП (+100% от должности)</span>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('risk')">
                              <input type="checkbox" id="risk" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Особые условия службы (+20%)</span>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('rc')">
                              <input type="checkbox" id="rc" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Районный коэффициент (+15%)</span>
                          </div>

                          <div class="result-box">
                              <div class="result-title">Итого на руки (Примерно)</div>
                              <div class="result-value" id="dd-total">0 руб.</div>
                              <div style="font-size: 11px; color: #6b7280;">С учётом вычета НДФЛ 13%</div>
                          </div>
                      </div>
                  </div>

                  <div id="tab-fp" class="tab-content">
                      <div class="card">
                          <h3>Проверка физподготовки</h3>
                          
                          <div class="form-group">
                              <label>Возрастная категория</label>
                              <select id="age-cat">
                                  <option value="1">Категория 1 (до 30 лет)</option>
                                  <option value="2">Категория 2 (30 - 35 лет)</option>
                                  <option value="3">Категория 3 (35+ лет)</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Подтягивания (кол-во)</label>
                              <input type="number" id="fp-pullups" placeholder="0" min="0">
                          </div>

                          <div class="form-group">
                              <label>Бег на 100 м (сек)</label>
                              <input type="number" step="0.1" id="fp-run100" placeholder="0.0" min="0">
                          </div>

                          <div class="form-group">
                              <label>Бег на 3 км (мин.сек)</label>
                              <input type="number" step="0.01" id="fp-run3k" placeholder="12.00" min="0">
                          </div>

                          <button class="btn" onclick="calculateFP()">Рассчитать баллы</button>

                          <div class="result-box" id="fp-result-box" style="display:none;">
                              <div class="result-title">Результат проверки</div>
                              <div class="result-value" id="fp-total-score">0 баллов</div>
                              <div id="fp-status" style="font-size: 14px; font-weight: bold; margin-top: 5px;"></div>
                          </div>
                      </div>
                  </div>

                  <div id="tab-contacts" class="tab-content">
                      <div class="card">
                          <h3>Связаться с кадрами</h3>
                          <p>Вы можете направить результаты расчетов или свои контактные данные напрямую офицеру по тестированию и комплектованию.</p>
                          <div class="form-group" style="margin-top: 15px;">
                              <label>Ваше имя</label>
                              <input type="text" id="cand-name" placeholder="Иван Иванов">
                          </div>
                          <div class="form-group">
                              <label>Телефон для связи</label>
                              <input type="text" id="cand-phone" placeholder="+7 (999) 000-00-00">
                          </div>
                          <button class="btn" onclick="sendData()">Отправить анкету</button>
                      </div>
                  </div>

              </div>

              <nav class="nav-bar">
                  <button class="nav-item active" onclick="switchTab('main', 'Главная')">
                      <span class="nav-icon">★</span>
                      <span>Главная</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('dd', 'Расчёт ДД')">
                      <span class="nav-icon">₽</span>
                      <span>Довольствие</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('fp', 'Нормативы ФП')">
                      <span class="nav-icon">⚔</span>
                      <span>Физподготовка</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('contacts', 'Контакты')">
                      <span class="nav-icon">✉</span>
                      <span>Контакты</span>
                  </button>
              </nav>

              <script>
                  // Переключение вкладок
                  function switchTab(tabId, title) {
                      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                      
                      document.getElementById('tab-' + tabId).classList.add('active');
                      document.getElementById('header-title').innerText = title;
                      
                      const event = window.event;
                      if(event) {
                          let btn = event.currentTarget;
                          if(btn) btn.classList.add('active');
                      }
                  }

                  // Функции калькулятора ДД
                  function toggleDDCheckbox(id) {
                      const cb = document.getElementById(id);
                      cb.checked = !cb.checked;
                      calculateDD();
                  }

                  function calculateDD() {
                      const okladZvanie = parseFloat(document.getElementById('rank').value);
                      const okladDolzhnost = parseFloat(document.getElementById('tariff').value);
                      const base = okladZvanie + okladDolzhnost;
                      
                      let allowances = 0;
                      allowments = 0;
                      
                      allowances += base * parseFloat(document.getElementById('experience').value);
                      allowances += okladDolzhnost * parseFloat(document.getElementById('secrecy').value);
                      
                      if(document.getElementById('cl').checked) allowances += okladDolzhnost * 0.10;
                      if(document.getElementById('fp_bonus').checked) allowances += okladDolzhnost * 1.00;
                      if(document.getElementById('risk').checked) allowances += okladDolzhnost * 0.20;
                      
                      let total = base + allowances;
                      if(document.getElementById('rc').checked) total = total * 1.15;
                      
                      const cleanTotal = Math.round(total * 0.87);
                      document.getElementById('dd-total').innerText = cleanTotal.toLocaleString('ru-RU') + " руб.";
                  }

                  // Функции калькулятора ФП
                  function calculateFP() {
                      const pullups = parseInt(document.getElementById('fp-pullups').value) || 0;
                      let score = pullups * 5; // Условный упрощенный расчет баллов
                      
                      document.getElementById('fp-result-box').style.display = "block";
                      document.getElementById('fp-total-score').innerText = score + " баллов";
                      
                      const status = document.getElementById('fp-status');
                      if(score >= 75) {
                          status.innerText = "Высший уровень выполнения нормативов!";
                          status.style.color = "#4ade80";
                      } else if(score >= 50) {
                          status.innerText = "Норматив выполнен успешно.";
                          status.style.color = "#fbbf24";
                      } else {
                          status.innerText = "Неудовлетворительно. Требуется подготовка.";
                          status.style.color = "#ef4444";
                      }
                  }

                  // Отправка данных анкеты
                  function sendData() {
                      const name = document.getElementById('cand-name').value || "Не указано";
                      const phone = document.getElementById('cand-phone').value || "Не указано";
                      const dd = document.getElementById('dd-total').innerText;
                      
                      const subject = "Новая анкета кандидата: " + name;
                      const body = "Имя: " + name + "\nТелефон: " + phone + "\nРассчитанное ДД на минимальных настройках: " + dd;
                      
                      if (typeof AndroidBridge !== 'undefined') {
                          AndroidBridge.sendEmail(subject, body);
                      } else {
                          alert("Данные отправлены:\n" + body);
                      }
                  }

                  // Первичный автоматический расчёт базового ДД на минималках при открытии
                  calculateDD();
              </script>
          </body>
          </html>
          EOF
          
          # Настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = "GlavkApp"
          include ':app'
          EOF
          
          # Главный билд-файл
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Билд-файл приложения
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.glavk.app'
              defaultConfig {
                  applicationId "com.glavk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "glavk123"
                      keyAlias "glavk"
                      keyPassword "glavk123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          # Манифест приложения с цифровым названием в лаунчере
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="12 Главк" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Нативный Java-код с глубоким перехватом URL-схем mailto:
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebView webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      private void handleMailto(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_SENDTO);
                              intent.setData(Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  
                  webView.loadUrl("file:///android_asset/index.html");
                  layout.addView(webView);
                  setContentView(layout);
              }
              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  public void showSystemToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_LONG).show();
                  }
                  @JavascriptInterface
                  public void sendEmail(String subject, String text) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SENDTO);
                          intent.setData(Uri.parse("mailto:rburov97@yandex.ru"));
                          intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                          intent.putExtra(Intent.EXTRA_TEXT, text);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          mContext.startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(mContext, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
