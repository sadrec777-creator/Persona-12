name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python and Pillow
        run: |
          pip install Pillow

      - name: Auto-Generate Android Project Structure
        run: |
          echo "=== Создание структуры и генерация эмблемы ==="
          mkdir -p app/src/main/java/com/glavk/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap
          
          # Скрипт генерации новой иконки: Величественный Золотой Двуглавый Орел
          cat << 'EOF' > generate_icon.py
          from PIL import Image, ImageDraw

          img = Image.new('RGBA', (512, 512), '#020617')
          draw = ImageDraw.Draw(img)

          gold_light = '#fbbf24'
          gold_base  = '#d4af37'
          gold_dark  = '#b45309'

          draw.ellipse([15, 15, 497, 497], outline=gold_dark, width=6)
          draw.ellipse([22, 22, 490, 490], outline=gold_base, width=3)
          draw.ellipse([35, 35, 477, 477], outline=gold_light, width=1)
          
          # Хвост орла
          draw.polygon([(230, 390), (256, 460), (282, 390)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(210, 370), (225, 440), (245, 385)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(302, 370), (287, 440), (267, 385)], fill=gold_base, outline=gold_dark, width=2)

          # Крылья
          draw.polygon([(220, 200), (60, 110), (120, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 230), (40, 180), (100, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(220, 260), (50, 260), (120, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(220, 290), (80, 330), (150, 390)], fill=gold_dark, outline=gold_base, width=1)

          draw.polygon([(292, 200), (452, 110), (392, 240)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 230), (472, 180), (412, 300)], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(292, 260), (462, 260), (392, 350)], fill=gold_base, outline=gold_dark, width=2)
          draw.polygon([(292, 290), (432, 330), (362, 390)], fill=gold_dark, outline=gold_base, width=1)

          # Лапы
          draw.line([(180, 340), (210, 370)], fill=gold_base, width=8)
          draw.ellipse([165, 330, 195, 360], fill=gold_light, outline=gold_dark, width=2)
          draw.line([(332, 340), (302, 370)], fill=gold_base, width=8)
          draw.line([(340, 310), (320, 370)], fill=gold_light, width=6)

          # Головы
          draw.polygon([(230, 200), (200, 130), (245, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([195, 110, 230, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(200, 120), (175, 125), (200, 135)], fill=gold_light)
          
          draw.polygon([(282, 200), (312, 130), (267, 130)], fill=gold_base, outline=gold_dark, width=2)
          draw.ellipse([282, 110, 317, 145], fill=gold_light, outline=gold_dark, width=2)
          draw.polygon([(312, 120), (337, 125), (312, 135)], fill=gold_light)

          # Короны
          draw.polygon([(200, 115), (207, 95), (215, 115)], fill=gold_light)
          draw.polygon([(297, 115), (305, 95), (312, 115)], fill=gold_light)
          draw.polygon([(235, 90), (256, 45), (277, 90), (256, 75)], fill=gold_light, outline=gold_dark, width=2)
          draw.ellipse([251, 40, 261, 50], fill=gold_light)

          # Центральный щит
          draw.polygon([(215, 210), (297, 210), (297, 320), (256, 365), (215, 320)], fill='#0f172a', outline=gold_light, width=4)
          draw.polygon([(225, 220), (287, 220), (287, 310), (256, 350), (225, 310)], outline=gold_dark, width=2)

          img.save('app/src/main/res/mipmap/ic_launcher.png')
          EOF
          
          python3 generate_icon.py

          # ГЕНЕРАЦИЯ ИНТЕРФЕЙСА С ЭФФЕКТОМ ЖИДКОГО СТЕКЛА И НОВЫМИ ВКЛАДКАМИ
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>12 Главк</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                  
                  /* Глубокий темно-синий тактический фон */
                  body { 
                      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
                      color: #f3f4f6; 
                      display: flex; 
                      flex-direction: column; 
                      height: 100vh; 
                      overflow: hidden; 
                  }
                  
                  /* Контентная зона */
                  .content-area { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 85px; }
                  .tab-content { display: none; max-width: 500px; margin: 0 auto; }
                  .tab-content.active { display: block; }
                  
                  /* Эффект прозрачного жидкого стекла (iOS Glassmorphism) */
                  .card { 
                      background: rgba(255, 255, 255, 0.04);
                      backdrop-filter: blur(20px);
                      -webkit-backdrop-filter: blur(20px);
                      border: 1px solid rgba(255, 255, 255, 0.12);
                      border-radius: 16px; 
                      padding: 20px; 
                      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                      margin-bottom: 16px; 
                  }
                  
                  h3 { color: #d4af37; margin-bottom: 16px; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
                  
                  .form-group { margin-bottom: 14px; }
                  label { display: block; margin-bottom: 6px; font-size: 13px; color: #9ca3af; }
                  
                  /* Поля ввода в стиле жидкого стекла */
                  select, input[type="number"], input[type="text"], input[type="date"], textarea { 
                      width: 100%; 
                      padding: 12px; 
                      background: rgba(255, 255, 255, 0.06);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      border-radius: 10px; 
                      color: #ffffff; 
                      font-size: 14px; 
                      outline: none;
                      transition: all 0.3s ease;
                  }
                  select:focus, input:focus, textarea:focus { 
                      border-color: rgba(212, 175, 55, 0.5);
                      background: rgba(255, 255, 255, 0.1);
                      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
                  }
                  
                  .checkbox-card { 
                      background: rgba(255, 255, 255, 0.03);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      border-radius: 10px; 
                      padding: 12px; 
                      margin-bottom: 10px; 
                      display: flex; 
                      align-items: center; 
                      cursor: pointer; 
                  }
                  .checkbox-card input[type="checkbox"] { width: 18px; height: 18px; margin-right: 12px; accent-color: #d4af37; }
                  
                  .result-box { 
                      margin-top: 20px; 
                      background: linear-gradient(135deg, rgba(30, 27, 75, 0.4), rgba(17, 24, 39, 0.4));
                      border: 1px solid rgba(212, 175, 55, 0.4); 
                      border-radius: 12px; 
                      padding: 16px; 
                      text-align: center; 
                  }
                  .result-value { font-size: 26px; font-weight: bold; color: #d4af37; margin: 4px 0; }
                  
                  .btn { 
                      display: block; 
                      width: 100%; 
                      padding: 14px; 
                      background: linear-gradient(135deg, #d4af37 0%, #aa841a 100%);
                      color: #0b0f19; 
                      border: none; 
                      border-radius: 10px; 
                      font-size: 14px; 
                      font-weight: bold; 
                      text-transform: uppercase; 
                      cursor: pointer; 
                      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
                  }
                  .btn:active { transform: scale(0.98); }
                  
                  /* Стили календаря */
                  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; text-align: center; }
                  .calendar-day { padding: 10px 0; background: rgba(255, 255, 255, 0.04); border-radius: 6px; font-size: 13px; cursor: pointer; }
                  .calendar-day.active { background: #d4af37; color: #0b0f19; font-weight: bold; }
                  .calendar-day.has-note { border-bottom: 3px solid #60a5fa; }
                  
                  /* Панель навигации iOS Glassmorphism в самом низу */
                  .nav-bar { 
                      position: fixed; 
                      bottom: 0; left: 0; right: 0; 
                      height: 68px; 
                      background: rgba(17, 24, 37, 0.4);
                      backdrop-filter: blur(30px);
                      -webkit-backdrop-filter: blur(30px);
                      border-top: 1px solid rgba(255, 255, 255, 0.08); 
                      display: flex; 
                      justify-content: space-around; 
                      align-items: center; 
                      z-index: 100; 
                      padding-bottom: 8px;
                  }
                  .nav-item { 
                      flex: 1; 
                      text-align: center; 
                      background: none; 
                      border: none; 
                      color: #9ca3af; 
                      font-size: 10px; 
                      cursor: pointer; 
                      display: flex; 
                      flex-direction: column; 
                      align-items: center; 
                      gap: 4px; 
                  }
                  .nav-item.active { color: #d4af37; }
                  .nav-icon { font-size: 20px; }
              </style>
          </head>
          <body>

              <div class="content-area">
                  
                  <div id="tab-dd" class="tab-content active">
                      <div class="card">
                          <h3>Расчёт денежного довольствия</h3>
                          
                          <div class="form-group">
                              <label>Воинское звание</label>
                              <select id="rank" onchange="calculateDD()">
                                  <option value="6500" selected>Рядовой / Матрос</option>
                                  <option value="7000">Ефрейтор / Старший матрос</option>
                                  <option value="7500">Младший сержант</option>
                                  <option value="8000">Сержант</option>
                                  <option value="8500">Старший сержант</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Тарифный разряд должности</label>
                              <select id="tariff" onchange="calculateDD()">
                                  <option value="12000" selected>1 тарифный разряд</option>
                                  <option value="13000">2 тарифный разряд</option>
                                  <option value="14000">3 тарифный разряд</option>
                                  <option value="15000">4 тарифный разряд</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Выслуга лет</label>
                              <select id="experience" onchange="calculateDD()">
                                  <option value="0" selected>менее 2 лет (0%)</option>
                                  <option value="0.10">от 2 до 5 лет (10%)</option>
                                  <option value="0.15">от 5 до 10 лет (15%)</option>
                              </select>
                          </div>

                          <div class="form-group">
                              <label>Допуск к гостайне</label>
                              <select id="secrecy" onchange="calculateDD()">
                                  <option value="0" selected>Нет допуска (0%)</option>
                                  <option value="0.10">3 форма (10%)</option>
                                  <option value="0.20">2 форма (20%)</option>
                              </select>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('cl')">
                              <input type="checkbox" id="cl" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Классная квалификация</span>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('fp_bonus')">
                              <input type="checkbox" id="fp_bonus" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Высший уровень ФП</span>
                          </div>

                          <div class="checkbox-card" onclick="toggleDDCheckbox('risk')">
                              <input type="checkbox" id="risk" onchange="calculateDD()" onclick="event.stopPropagation()">
                              <span>Особые условия службы</span>
                          </div>

                          <div class="result-box">
                              <div class="result-title">Итого к получению (Примерно)</div>
                              <div class="result-value" id="dd-total">0 руб.</div>
                          </div>
                      </div>
                  </div>

                  <div id="tab-fp" class="tab-content">
                      <div class="card">
                          <h3>Физическая подготовка</h3>
                          <div class="form-group">
                              <label>Подтягивания (количество)</label>
                              <input type="number" id="fp-pullups" placeholder="0">
                          </div>
                          <div class="form-group">
                              <label>Бег на 100 м (секунды)</label>
                              <input type="number" step="0.1" id="fp-run100" placeholder="0.0">
                          </div>
                          <button class="btn" onclick="calculateFP()">Проверить нормативы</button>
                          
                          <div class="result-box" id="fp-res-box" style="display:none;">
                              <div class="result-value" id="fp-score">0 баллов</div>
                              <div id="fp-text" style="font-size:13px; margin-top:5px;"></div>
                          </div>
                      </div>
                  </div>

                  <div id="tab-calendar" class="tab-content">
                      <div class="card">
                          <h3>Календарь и заметки</h3>
                          <div class="calendar-grid" id="calendar-days"></div>
                          
                          <div class="form-group" style="margin-top: 20px;">
                              <label id="note-label">Выберите день для заметки</label>
                              <textarea id="note-text" rows="3" placeholder="Введите важную отметку или событие..."></textarea>
                          </div>
                          <button class="btn" onclick="saveNote()">Сохранить отметку</button>
                      </div>
                  </div>

                  <div id="tab-anketa" class="tab-content">
                      <div class="card">
                          <h3>Анкета нового кандидата</h3>
                          <div class="form-group">
                              <label>Фамилия, Имя, Отчество</label>
                              <input type="text" id="c-fio" placeholder="Иванов Иван Иванович">
                          </div>
                          <div class="form-group">
                              <label>Номер телефона</label>
                              <input type="text" id="c-phone" placeholder="+7 (999) 000-00-00">
                          </div>
                          <div class="form-group">
                              <label>Дата рождения</label>
                              <input type="date" id="c-birthday">
                          </div>
                          <div class="form-group">
                              <label>Регион, где был найден</label>
                              <input type="text" id="c-region" placeholder="Московская область">
                          </div>
                          <button class="btn" onclick="sendAnketa()">Отправить анкету</button>
                      </div>
                  </div>

                  <div id="tab-complaint" class="tab-content">
                      <div class="card">
                          <h3>Подать жалобу / Обращение</h3>
                          <div class="form-group">
                              <label>Суть поданного обращения или претензии</label>
                              <textarea id="complaint-text" rows="5" placeholder="Опишите подробно возникшую ситуацию или проблему..."></textarea>
                          </div>
                          <button class="btn" onclick="sendComplaint()">Направить жалобу</button>
                      </div>
                  </div>

              </div>

              <nav class="nav-bar">
                  <button class="nav-item active" onclick="switchTab('dd')">
                      <span class="nav-icon">₽</span>
                      <span>ДД</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('fp')">
                      <span class="nav-icon">⚔</span>
                      <span>ФП</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('calendar')">
                      <span class="nav-icon">📅</span>
                      <span>Календарь</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('anketa')">
                      <span class="nav-icon">👤</span>
                      <span>Кандидат</span>
                  </button>
                  <button class="nav-item" onclick="switchTab('complaint')">
                      <span class="nav-icon">⚠️</span>
                      <span>Жалоба</span>
                  </button>
              </nav>

              <script>
                  let selectedDay = null;
                  const notesData = JSON.parse(localStorage.getItem('glavk_notes') || '{}');

                  function switchTab(tabId) {
                      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                      
                      document.getElementById('tab-' + tabId).classList.add('active');
                      
                      const event = window.event;
                      if(event) {
                          event.currentTarget.classList.add('active');
                      } else {
                          // Поиск кнопки при инициализации
                          document.querySelectorAll('.nav-item').forEach(btn => {
                              if(btn.getAttribute('onclick').includes(tabId)) btn.classList.add('active');
                          });
                      }
                      if(tabId === 'calendar') buildCalendar();
                  }

                  function toggleDDCheckbox(id) {
                      const cb = document.getElementById(id);
                      cb.checked = !cb.checked;
                      calculateDD();
                  }

                  function calculateDD() {
                      const okladZvanie = parseFloat(document.getElementById('rank').value);
                      const okladDolzhnost = parseFloat(document.getElementById('tariff').value);
                      const base = okladZvanie + okladDolzhnost;
                      
                      let allowances = 0;
                      allowances += base * parseFloat(document.getElementById('experience').value);
                      allowances += okladDolzhnost * parseFloat(document.getElementById('secrecy').value);
                      
                      if(document.getElementById('cl').checked) allowances += okladDolzhnost * 0.10;
                      if(document.getElementById('fp_bonus').checked) allowances += okladDolzhnost * 1.00;
                      if(document.getElementById('risk').checked) allowances += okladDolzhnost * 0.20;
                      
                      const cleanTotal = Math.round((base + allowances) * 0.87);
                      document.getElementById('dd-total').innerText = cleanTotal.toLocaleString('ru-RU') + " руб.";
                  }

                  function calculateFP() {
                      const pullups = parseInt(document.getElementById('fp-pullups').value) || 0;
                      const score = pullups * 6;
                      document.getElementById('fp-res-box').style.display = "block";
                      document.getElementById('fp-score').innerText = score + " баллов";
                      document.getElementById('fp-text').innerText = score >= 60 ? "Уровень подготовленности: Высокий" : "Требуется подтянуть результаты";
                  }

                  function buildCalendar() {
                      const grid = document.getElementById('calendar-days');
                      grid.innerHTML = '';
                      for(let i = 1; i <= 30; i++) {
                          const day = document.createElement('div');
                          day.className = 'calendar-day';
                          if(notesData[i]) day.className += ' has-note';
                          if(selectedDay === i) day.className += ' active';
                          day.innerText = i;
                          day.onclick = () => selectDay(i);
                          grid.appendChild(day);
                      }
                  }

                  function selectDay(dayNum) {
                      selectedDay = dayNum;
                      document.getElementById('note-label').innerText = "Заметка на " + dayNum + " число:";
                      document.getElementById('note-text').value = notesData[dayNum] || '';
                      buildCalendar();
                  }

                  function saveNote() {
                      if(!selectedDay) { alert("Сначала выберите день на сетке!"); return; }
                      const txt = document.getElementById('note-text').value;
                      if(txt.trim()) {
                          notesData[selectedDay] = txt;
                      } else {
                          delete notesData[selectedDay];
                      }
                      localStorage.setItem('glavk_notes', JSON.stringify(notesData));
                      buildCalendar();
                      if(typeof AndroidBridge !== 'undefined') AndroidBridge.showSystemToast("Отметка сохранена");
                  }

                  function sendAnketa() {
                      const fio = document.getElementById('c-fio').value;
                      const phone = document.getElementById('c-phone').value;
                      const bday = document.getElementById('c-birthday').value;
                      const region = document.getElementById('c-region').value;
                      
                      const body = `Новый кандидат:\nФИО: ${fio}\nТелефон: ${phone}\nДата рождения: ${bday}\nРегион обнаружения: ${region}`;
                      if(typeof AndroidBridge !== 'undefined') {
                          AndroidBridge.sendEmail("Регистрация кандидата (" + fio + ")", body);
                      } else {
                          alert(body);
                      }
                  }

                  function sendComplaint() {
                      const text = document.getElementById('complaint-text').value;
                      if(typeof AndroidBridge !== 'undefined') {
                          AndroidBridge.sendEmail("Подача официальной жалобы", text);
                      } else {
                          alert("Жалоба направлена:\n" + text);
                      }
                  }

                  calculateDD();
              </script>
          </body>
          </html>
          EOF
          
          # Настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = "GlavkApp"
          include ':app'
          EOF
          
          # Главный билд-файл
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Билд-файл приложения
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.glavk.app'
              defaultConfig {
                  applicationId "com.glavk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "glavk123"
                      keyAlias "glavk"
                      keyPassword "glavk123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          # Манифест приложения с цифровым названием в лаунчере
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="12 Главк" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Нативный Java-код с глубоким перехватом URL-схем mailto:
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebView webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      private void handleMailto(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_SENDTO);
                              intent.setData(Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  
                  webView.loadUrl("file:///android_asset/index.html");
                  layout.addView(webView);
                  setContentView(layout);
              }
              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  public void showSystemToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_LONG).show();
                  }
                  @JavascriptInterface
                  public void sendEmail(String subject, String text) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SENDTO);
                          intent.setData(Uri.parse("mailto:rburov97@yandex.ru"));
                          intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                          intent.putExtra(Intent.EXTRA_TEXT, text);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          mContext.startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(mContext, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
