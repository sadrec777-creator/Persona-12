name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python and Pillow
        run: |
          pip install Pillow

      - name: Auto-Generate Android Project Structure
        run: |
          echo "=== Создание структуры и генерация эмблемы ==="
          mkdir -p app/src/main/java/com/glavk/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap
          
          # Скрипт генерации премиальной тактической иконки 12 Главка
          cat << 'EOF' > generate_icon.py
          from PIL import Image, ImageDraw

          # Создаем холст 512x512
          img = Image.new('RGBA', (512, 512), '#050b14')
          draw = ImageDraw.Draw(img)

          # Внешние защитные тактические кольца
          draw.ellipse([15, 15, 497, 497], outline='#38bdf8', width=4)
          draw.ellipse([25, 25, 487, 487], outline='#d4af37', width=6)

          # Отрисовка геометрии крыльев (стилизация под имперского орла)
          gold = '#d4af37'
          # Левое крыло
          draw.polygon([(190, 160), (80, 130), (110, 200)], fill=gold)
          draw.polygon([(190, 210), (60, 190), (95, 260)], fill=gold)
          draw.polygon([(190, 260), (70, 260), (120, 320)], fill=gold)
          # Правое крыло (зеркальное отражение)
          draw.polygon([(322, 160), (432, 130), (402, 200)], fill=gold)
          draw.polygon([(322, 210), (452, 190), (417, 260)], fill=gold)
          draw.polygon([(322, 260), (442, 260), (392, 320)], fill=gold)

          # Центральный боевой щит
          draw.polygon([(185, 180), (327, 180), (327, 340), (256, 410), (185, 340)], fill='#081125', outline='#38bdf8', width=6)

          # Отрисовка тактической цифры "1" (Трафаретный армейский блок)
          draw.rectangle([210, 220, 228, 315], fill='#ffffff')
          draw.polygon([(192, 240), (210, 220), (210, 240)], fill='#ffffff')
          draw.rectangle([200, 305, 238, 315], fill='#ffffff')

          # Отрисовка тактической цифры "2" (Технологичные сегменты)
          draw.rectangle([255, 220, 295, 235], fill='#ffffff')
          draw.rectangle([280, 235, 295, 260], fill='#ffffff')
          draw.rectangle([255, 260, 295, 275], fill='#ffffff')
          draw.rectangle([255, 275, 270, 300], fill='#ffffff')
          draw.rectangle([255, 300, 295, 315], fill='#ffffff')

          img.save('app/src/main/res/mipmap/ic_launcher.png')
          print("=== Иконка успешно сгенерирована ===")
          EOF
          
          python3 generate_icon.py

          # Копируем твой прокачанный интерфейс с калькуляторами
          cp index.html app/src/main/assets/index.html
          
          # Настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = "GlavkApp"
          include ':app'
          EOF
          
          # Главный билд-файл
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Билд-файл самого приложения
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.glavk.app'
              defaultConfig {
                  applicationId "com.glavk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          
          # Манифест приложения с цифровым названием в лаунчере
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="12 Главк" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Нативный Java-код с поддержкой отправки писем через Интенты Android
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebView webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  layout.addView(webView);
                  setContentView(layout);
              }
              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  public void showSystemToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_LONG).show();
                  }

                  @JavascriptInterface
                  public void sendEmail(String subject, String text) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SENDTO);
                          intent.setData(Uri.parse("mailto:rburov97@yandex.ru"));
                          intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                          intent.putExtra(Intent.EXTRA_TEXT, text);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          mContext.startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(mContext, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
          EOF

      - name: Build Application with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: GlavkApp-Finished
          path: app/build/outputs/apk/debug/app-debug.apk
