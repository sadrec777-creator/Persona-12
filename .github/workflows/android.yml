name: Cloud Compile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python and Pillow
        run: |
          pip install Pillow

      - name: Auto-Generate Android Project Structure
        run: |
          echo "=== Создание структуры и генерация эмблемы ==="
          mkdir -p app/src/main/java/com/glavk/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap
          
          # Скрипт генерации тактической иконки: Золотой Двуглавый Орел на фоне цифры 12
          cat << 'EOF' > generate_icon.py
          from PIL import Image, ImageDraw

          # Создаем холст 512x512 (глубокий тактический фон)
          img = Image.new('RGBA', (512, 512), '#030712')
          draw = ImageDraw.Draw(img)

          # 1. ЗАДНИЙ ПЛАН: Массивная цифра "12" (темный контрастный цвет)
          bg_digit = '#111827'
          # Цифра 1
          draw.rectangle([110, 100, 150, 412], fill=bg_digit)
          draw.polygon([(70, 140), (110, 100), (110, 150)], fill=bg_digit)
          # Цифра 2
          draw.rectangle([210, 100, 390, 140], fill=bg_digit)
          draw.rectangle([350, 140, 390, 260], fill=bg_digit)
          draw.rectangle([210, 260, 390, 300], fill=bg_digit)
          draw.rectangle([210, 300, 250, 380], fill=bg_digit)
          draw.rectangle([210, 372, 390, 412], fill=bg_digit)

          # Внешнее золотое защитное кольцо
          gold = '#d4af37'
          draw.ellipse([20, 20, 492, 492], outline=gold, width=4)

          # 2. ПЕРЕДНИЙ ПЛАН: Золотистый Двуглавый Орел
          # Центральный боевой щит на груди
          draw.polygon([(220, 240), (292, 240), (292, 340), (256, 380), (220, 340)], fill='#0f172a', outline=gold, width=4)

          # Левое крыло (мощные перья)
          draw.polygon([(220, 220), (90, 140), (130, 260)], fill=gold)
          draw.polygon([(220, 250), (70, 220), (110, 320)], fill=gold)
          draw.polygon([(220, 280), (80, 300), (140, 370)], fill=gold)

          # Правое крыло (зеркальное отражение)
          draw.polygon([(292, 220), (422, 140), (382, 260)], fill=gold)
          draw.polygon([(292, 250), (442, 220), (402, 320)], fill=gold)
          draw.polygon([(292, 280), (432, 300), (372, 370)], fill=gold)

          # Левая голова и шея
          draw.polygon([(225, 220), (210, 160), (240, 160)], fill=gold)
          draw.ellipse([205, 140, 235, 170], fill=gold)
          draw.polygon([(210, 150), (185, 155), (210, 160)], fill=gold) # Клюв

          # Правая голова и шея
          draw.polygon([(287, 220), (272, 160), (302, 160)], fill=gold)
          draw.ellipse([277, 140, 307, 170], fill=gold)
          draw.polygon([(302, 150), (327, 155), (302, 160)], fill=gold) # Клюв

          #  Имперская корона по центру командных высот
          draw.polygon([(240, 130), (256, 95), (272, 130), (256, 115)], fill=gold)

          # Хвостовое оперение
          draw.polygon([(240, 380), (256, 440), (272, 380)], fill=gold)
          draw.polygon([(225, 360), (235, 430), (250, 380)], fill=gold)
          draw.polygon([(287, 360), (277, 430), (262, 380)], fill=gold)

          img.save('app/src/main/res/mipmap/ic_launcher.png')
          print("=== Новый боевой логотип сгенерирован успешно ===")
          EOF
          
          python3 generate_icon.py

          # Копируем интерфейс
          cp index.html app/src/main/assets/index.html
          
          # Настройки проекта
          cat << 'EOF' > settings.gradle
          rootProject.name = "GlavkApp"
          include ':app'
          EOF
          
          # Главный билд-файл
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Билд-файл приложения с конфигурацией релизной цифровой подписи
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.glavk.app'
              defaultConfig {
                  applicationId "com.glavk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "glavk123"
                      keyAlias "glavk"
                      keyPassword "glavk123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          
          # Манифест приложения с цифровым названием в лаунчере
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="12 Главк" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Нативный Java-код с глубоким перехватом URL-схем mailto:
          cat << 'EOF' > app/src/main/java/com/glavk/app/MainActivity.java
          package com.glavk.app;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebView webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  
                  // Перехват кликов внутри HTML-интерфейса для устранения ERR_UNKNOWN_URL_SCHEME
                  webView.setWebViewClient(new WebViewClient() {
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("mailto:")) {
                              handleMailto(url);
                              return true;
                          }
                          return false;
                      }
                      private void handleMailto(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_SENDTO);
                              intent.setData(Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  
                  webView.loadUrl("file:///android_asset/index.html");
                  layout.addView(webView);
                  setContentView(layout);
              }
              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  public void showSystemToast(String message) {
                      Toast.makeText(mContext, message, Toast.LENGTH_LONG).show();
                  }
                  @JavascriptInterface
                  public void sendEmail(String subject, String text) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SENDTO);
                          intent.setData(Uri.parse("mailto:rburov97@yandex.ru"));
                          intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                          intent.putExtra(Intent.EXTRA_TEXT, text);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          mContext.startActivity(intent);
                      } catch (Exception e) {
                          Toast.makeText(mContext, "Ошибка: нет почтового приложения", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
          EOF

      # Генерация официального криптографического Keystore для устранения ошибок подписи пакета
      - name: Generate Production Signing Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias glavk -keyalg RSA -keysize 2048 -validity 10000 -storepass glavk123 -keypass glavk123 -dname "CN=12Glavk, O=Glavk, C=RU"

      - name: Build Certified Release Application with Gradle
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished Certified APK
        uses: actions/upload-artifact@v4
        with:
          name: GlavkApp-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
